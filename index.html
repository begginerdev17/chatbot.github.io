<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Local</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.2/lottie.min.js"></script>
  <script src="frontend.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #121214;
      color: #f5f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0f1012 0%, #16181c 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
      background: rgba(10,11,13,0.96);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 16px 12px;
      background: rgba(15,16,18,0.92);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
    }

    .chat-back,
    .chat-more {
      border: none;
      background: transparent;
      color: #f5f5f7;
      font-size: 20px;
      cursor: pointer;
    }

    .chat-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5c9cff, #7d3bff);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }

    .chat-title strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
    }

    .chat-subtitle {
      display: block;
      font-size: 13px;
      color: #bfc0c8;
      margin-top: 2px;
    }
    .chat-clean {
      align-self: auto;
      height: 50%;
      width: 28%;
      border: rgba(0, 0, 0, 0.712);
      background: rgba(26,29,36,0.96);
      color: rgba(255, 255, 255, 0.945);
      border-radius: 999px;
      justify-content: center;
      cursor: pointer;
    }
    .chat-clean:hover {
      background: rgb(48, 44, 44)
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0f1012;
      z-index: 20;
      padding: 24px;
    }

    .intro-screen > div {
      width: min(320px, 90%);
      height: min(320px, 90%);
    }

    .chat-animation {
      width: 100%;
      height: 240px;
      background: #111318;
      display: grid;
      place-items: center;
    }

    .chat-animation > div {
      width: min(260px, 90%);
      height: min(260px, 90%);
    }

    .hidden {
      display: none !important;
    }

    .chat-info-bar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(16,17,20,0.88);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .chat-info-bar span {
      font-size: 13px;
      color: #c8c9d6;
    }

    .chat-continue {
      padding: 10px 14px;
      border: none;
      border-radius: 999px;
      background: #3f8dff;
      color: white;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .chat-continue:disabled {
      background: rgba(63,141,255,0.35);
      cursor: not-allowed;
    }

    .chat-body {
      flex: 1;
      overflow: hidden;
      background: url('') center/cover no-repeat;
    }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      padding: 18px 16px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat-bubble {
      max-width: 78%;
      padding: 12px 14px;
      line-height: 1.5;
      border-radius: 20px;
      word-break: break-word;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: rgba(246,255,234,0.95);
      color: #111111;
      border-bottom-right-radius: 6px;
      border-bottom-left-radius: 20px;
    }

    .chat-bubble.assistant {
      align-self: flex-start;
      background: rgba(26,29,36,0.96);
      color: #f2f3f8;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 20px;
    }

    .chat-action-row {
      padding: 14px 16px 20px;
      background: rgba(13,14,17,0.98);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .chat-form {
      display: flex;
      gap: 10px;
    }

    .chat-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 10px 14px;
    }

    .chat-input-action {
      border: none;
      background: rgba(255,255,255,0.08);
      color: #f5f5f7;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .chat-input {
      border: none;
      background: transparent;
      color: #f5f5f7;
      width: 100%;
      min-width: 0;
      font-size: 15px;
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .chat-send {
      border: none;
      background: #1c63ce;
      color: white;
      border-radius: 999px;
      padding: 0 18px;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .chat-send:hover {
      background: #073f97;
    }
  </style>
</head>
<body>
  <section class="intro-screen" id="introScreen">
    <div id="introAnimation"></div>
  </section>

  <div class="chat-screen hidden" id="chatScreen">
    <header class="chat-header">
      <button type="button" class="chat-back" aria-label="Volver">←</button>
      <div class="chat-title-group">
        <div class="chat-avatar"></div>
        <div class="chat-title">
          <strong>FantasiaBot</strong>
          <span class="chat-subtitle">Asistente local</span>
        </div>
      </div>
      <button type="button" class="chat-clean"aria-label="borrar historial">Borrar historial</button>
      <button type="button" class="chat-more" aria-label="Más opciones">⋮</button>
    </header>

    <section class="chat-info-bar">
      <span id="statusLabel">Listo para chatear.</span>
      <button id="continueButton" class="chat-continue">Continuar</button>
    </section>

    <main class="chat-body">
      <div id="chatMessages" class="chat-messages"></div>
    </main>

    <section class="chat-action-row">
      <form id="chatForm" class="chat-form">
        <div class="chat-input-wrapper">
          <button type="button" class="chat-input-action" aria-label="Acciones">+</button>
          <input
            id="messageInput"
            class="chat-input"
            type="text"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
          />
        </div>
        <button id="sendButton" type="submit" class="chat-send">Enviar</button>
      </form>
    </section>
  </div>

  <script>
    const introScreen = document.getElementById('introScreen');
    const chatScreen = document.getElementById('chatScreen');

    if (typeof lottie !== 'undefined') {
      const animationItem = lottie.loadAnimation({
        container: document.getElementById('introAnimation'),
        renderer: 'svg',
        loop: false,
        autoplay: true,
        path: 'launch.json'
      });

      animationItem.addEventListener('complete', () => {
        setTimeout(() => {
          introScreen.classList.add('hidden');
          chatScreen.classList.remove('hidden');
        }, 2000);
      });
    } else {
      console.warn('Lottie no está disponible.');
      introScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
